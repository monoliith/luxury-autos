<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxury Autos</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'), linear-gradient(to bottom right, #000000, #1a1a1a);
      background-repeat: repeat;
      background-size: auto, cover;
      color: #D4AF37;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: linear-gradient(to right, #111, #2E2E2E);
      padding: 2rem;
      text-align: center;
      font-size: 2.5rem;
      font-weight: 700;
      border-bottom: 3px solid #D4AF37;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    main {
      padding: 3rem 2rem;
    }

    .table-container {
      overflow-x: auto;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.15);
      padding: 1rem;
      border: 2px solid;
      border-image: linear-gradient(90deg, #D4AF37, #8B6F28, #D4AF37) 1;
      animation: borderFlow 5s linear infinite;
    }

    @keyframes borderFlow {
      0% {
        border-image-source: linear-gradient(90deg, #D4AF37, #8B6F28, #D4AF37);
      }
      50% {
        border-image-source: linear-gradient(90deg, #8B6F28, #D4AF37, #8B6F28);
      }
      100% {
        border-image-source: linear-gradient(90deg, #D4AF37, #8B6F28, #D4AF37);
      }
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      background-color: transparent;
      color: #fff;
    }

    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.95rem;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: normal;
      transition: background 0.3s ease;
    }

    th {
      cursor: pointer;
      color: #FFD700;
      background: linear-gradient(to right, #2c2c2c, #1a1a1a);
      text-shadow: 0 0 5px rgba(255, 215, 0, 0.4);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    th.active {
      background: linear-gradient(to right, #3b3b3b, #1f1f1f);
      border-bottom: 2px solid #FFD700;
      color: #FFD700;
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.5);
    }

    .arrow {
      margin-left: 0.4rem;
      font-size: 0.8rem;
      opacity: 0.6;
    }

    tbody tr {
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    tr:hover {
      background: rgba(255, 215, 0, 0.08);
    }

    .loading {
      text-align: center;
      margin-top: 3rem;
      font-size: 1.5rem;
      color: #ccc;
      font-style: italic;
    }
  </style>
</head>
<body>
  <header>Luxury Autos</header>
  <main>
    <div class="loading">Loading cars...</div>
    <div class="table-container">
      <table id="carTable" style="display:none">
        <thead>
          <tr>
            <th onclick="sortTable(0)">Price <span class="arrow"></span></th>
            <th onclick="sortTable(1)">Class <span class="arrow"></span></th>
            <th onclick="sortTable(2)">Model <span class="arrow"></span></th>
            <th onclick="sortTable(3)">Category <span class="arrow"></span></th>
            <th onclick="sortTable(4)">Brand <span class="arrow"></span></th>
            <th onclick="sortTable(5)">Seats <span class="arrow"></span></th>
            <th onclick="sortTable(6)">Stock <span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody id="carTableBody"></tbody>
      </table>
    </div>
  </main>
  <script>
    const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT0QirCZmwYBhvOAXHEMjniGM3BnJujWNrCLB19NumG9ihbG4KkhGQinLuDGdNYkd9dkxEDCehXVNIy/pub?output=csv';

    fetch(sheetURL)
      .then(res => res.text())
      .then(data => {
        const rows = data.split('\n').slice(1);
        const tbody = document.getElementById('carTableBody');
        rows.forEach(row => {
          const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
          if (cols && cols.length >= 7) {
            const tr = document.createElement('tr');
            cols.forEach(col => {
              const td = document.createElement('td');
              td.textContent = col.replace(/(^"|"$)/g, '');
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          }
        });
        document.querySelector('.loading').style.display = 'none';
        document.getElementById('carTable').style.display = 'table';
      });

    function sortTable(colIndex) {
      const table = document.getElementById("carTable");
      const tbody = table.querySelector("tbody");
      const rows = Array.from(tbody.querySelectorAll("tr"));
      const headers = table.querySelectorAll("th");
      const arrows = table.querySelectorAll(".arrow");

      let isAsc = table.getAttribute("data-sort-dir") !== "asc";
      table.setAttribute("data-sort-dir", isAsc ? "asc" : "desc");

      rows.forEach(row => row.style.opacity = 0);

      setTimeout(() => {
        rows.sort((a, b) => {
          const aText = a.children[colIndex]?.textContent.trim() || "";
          const bText = b.children[colIndex]?.textContent.trim() || "";

          const aVal = parseFloat(aText.replace(/[$,]/g, '')) || aText.toLowerCase();
          const bVal = parseFloat(bText.replace(/[$,]/g, '')) || bText.toLowerCase();

          if (aVal < bVal) return isAsc ? -1 : 1;
          if (aVal > bVal) return isAsc ? 1 : -1;
          return 0;
        });

        headers.forEach(th => th.classList.remove("active"));
        arrows.forEach(arrow => arrow.textContent = "");

        headers[colIndex].classList.add("active");
        headers[colIndex].querySelector(".arrow").textContent = isAsc ? "▲" : "▼";

        rows.forEach(row => {
          tbody.appendChild(row);
          row.style.opacity = 1;
        });
      }, 200);
    }
  </script>
</body>
</html>
